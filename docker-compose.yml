x-airflow-common: &airflow-common
  build: .
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:-airflow}@airflow-postgres/airflow
    # Обязателен и не имеет дефолта: с пустым ключом Airflow не шифрует
    # Connections, и всё, что было сохранено раньше, перестаёт читаться после
    # пересоздания контейнера. Лучше громко упасть на старте, чем молча
    # потерять подключения. Генерация ключа — см. .env.example
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?нужен ключ, сгенерируйте по инструкции в .env.example}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    # localhost из .env каждого репозитория внутри контейнера означал бы
    # сам контейнер — переопределено на host.docker.internal (тот же
    # приём, что уже использует product-marketing-analytics/docker-compose.yml
    # для Metabase). python-dotenv не перезаписывает уже установленные
    # переменные окружения, поэтому .env репозиториев не трогаем.
    DB_HOST: host.docker.internal
    DB_PORT: "5432"
    DB_NAME: etl_portfolio
    DB_USER: postgres
    DB_PASSWORD: ${ETL_DB_PASSWORD:?нужен тот же пароль, что в .env соответствующего репозитория}
    VECTOR_DB_HOST: host.docker.internal
    VECTOR_DB_PORT: "5433"
    VECTOR_DB_NAME: triage
    VECTOR_DB_USER: postgres
    VECTOR_DB_PASSWORD: ${VECTOR_DB_PASSWORD:?нужен тот же пароль, что в .env соответствующего репозитория}
    CLICKHOUSE_HOST: host.docker.internal
    CLICKHOUSE_PORT: "8123"
    CLICKHOUSE_USER: default
    CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?нужен тот же пароль, что в .env соответствующего репозитория}
    OLLAMA_HOST: http://host.docker.internal:11434
    OLLAMA_CHAT_MODEL: qwen2.5:3b-instruct
    OLLAMA_EMBED_MODEL: all-minilm
    # n8n-business-automation — соседний репозиторий, отдельный docker-compose,
    # порт 5678 проброшен на host (см. его docker-compose.yml)
    N8N_WEBHOOK_URL: http://host.docker.internal:5678/webhook/etl-failure-alert
    N8N_QUALITY_WEBHOOK_URL: http://host.docker.internal:5678/webhook/etl-quality-report
    N8N_DOCS_WEBHOOK_URL: http://host.docker.internal:5678/webhook/docs-refresh
    N8N_DRIFT_WEBHOOK_URL: http://host.docker.internal:5678/webhook/triage-drift-check
    # mlflow — сервис в этом же docker-compose (см. ниже), поэтому по имени
    # сервиса в общей compose-сети, а не host.docker.internal
    MLFLOW_TRACKING_URI: http://mlflow:5501
    # OpenLineage: автоматический column-level lineage через штатный листенер
    # провайдера (см. Dockerfile) — задачи ничего не меняют, события сами
    # улетают в Marquez (сервис в этом же compose, см. ниже) при каждом
    # прогоне DAG. Формат transport — задокументированный JSON, а не
    # устаревшие OPENLINEAGE_URL/OPENLINEAGE_NAMESPACE переменные.
    AIRFLOW__OPENLINEAGE__TRANSPORT: '{"type": "http", "url": "http://marquez-api:5000", "endpoint": "api/v1/lineage"}'
    AIRFLOW__OPENLINEAGE__NAMESPACE: ecosystem_pipeline
  volumes: &airflow-common-volumes
    - ./dags:/opt/airflow/dags
    - ./scripts:/opt/airflow/scripts
    - airflow-logs:/opt/airflow/logs
    - ../etl-portfolio:/opt/repos/etl-portfolio
    - ../product-marketing-analytics:/opt/repos/product-marketing-analytics
    # MLflow с локальным artifact-root (--default-artifact-root /mlflow/artifacts,
    # см. сервис mlflow ниже) требует, чтобы КЛИЕНТ писал артефакты на тот же
    # диск, что и сервер — mlflow.sklearn.log_model() не проксирует запись через
    # HTTP, а обращается к artifact_uri как к локальному пути. Без этого маунта
    # train_churn_model падает с PermissionError: '/mlflow' (путь просто не
    # существует в контейнере airflow).
    - mlflow-data:/mlflow
    - ../llm-practice:/opt/repos/support-triage-llm
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    airflow-postgres:
      condition: service_healthy

services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.19.0
    # chmod при каждом старте, не только один раз вручную: /mlflow теперь
    # смонтирован и в контейнеры airflow (см. airflow-common-volumes выше) —
    # mlflow.sklearn.log_model() пишет туда напрямую как в локальный путь, не
    # через HTTP API. На свежем томе каталог создаётся этим (mlflow) образом
    # от root, а airflow-процесс работает под uid 50000 — без group-write
    # получаем PermissionError: '/mlflow', реально пойманный живым прогоном
    # DAG. Живёт в command, а не только в текущем состоянии тома, чтобы
    # `docker volume rm mlflow-data` не воскресил баг.
    command: >
      sh -c "chmod -R g+rwX /mlflow &&
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5501"
    ports:
      - "5501:5501"
    volumes:
      - mlflow-data:/mlflow

  # OpenLineage-бэкенд: собирает события lineage, которые провайдер в
  # Dockerfile отправляет автоматически при каждом прогоне DAG. Версии и
  # порты — из официального docker-compose.yml проекта Marquez
  # (github.com/MarquezProject/marquez), собственный Postgres не публикуется
  # на host (нужен только marquez-api внутри compose-сети, порт 5432 хоста
  # уже занят настоящим etl_portfolio Postgres).
  marquez-db:
    image: postgres:14
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      MARQUEZ_DB: marquez
      MARQUEZ_USER: marquez
      MARQUEZ_PASSWORD: marquez
    volumes:
      - marquez-db-data:/var/lib/postgresql/data
      - ./marquez/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  marquez-api:
    image: marquezproject/marquez:0.51.1
    environment:
      MARQUEZ_PORT: "5000"
      MARQUEZ_ADMIN_PORT: "5001"
      POSTGRES_HOST: marquez-db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      SEARCH_ENABLED: "false"
    ports:
      - "5000:5000"
      - "5001:5001"
    depends_on:
      marquez-db:
        condition: service_healthy

  marquez-web:
    image: marquezproject/marquez-web:0.51.1
    environment:
      MARQUEZ_HOST: marquez-api
      MARQUEZ_PORT: "5000"
      WEB_PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      - marquez-api

  airflow-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow}
      POSTGRES_DB: airflow
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    # `|| true` в конце глушил ЛЮБУЮ ошибку создания пользователя, а не только
    # «уже существует» — при сломанной миграции инициализация всё равно
    # считалась успешной, и webserver стартовал в нерабочую базу. Теперь
    # неудача прощается ровно в одном случае: админ уже есть.
    command:
      - -c
      - >
        set -e;
        airflow db migrate;
        airflow users create --username admin
        --password "${AIRFLOW_ADMIN_PASSWORD:-admin}"
        --firstname Nikolay --lastname Kolesnikov --role Admin
        --email admin@example.com
        || airflow users list --output json | grep -q '"username": "admin"'

  airflow-webserver:
    <<: *airflow-common
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    command: webserver

  airflow-scheduler:
    <<: *airflow-common
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    command: scheduler

volumes:
  airflow-postgres-data:
  airflow-logs:
  mlflow-data:
  marquez-db-data:
